name: Offline source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source provenance and release hygiene
        run: |
          python -B tools/check_release.py --manifest SOURCE_MANIFEST.json
          python -B tools/check_release.py --manifest RELEASE_FILES.json
      - name: Offline unit tests
        run: python -B -m unittest discover -s tests -v
